<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">Tám trạng thái hoạt động và mục tiêu</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="1240" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><text x="32" y="66" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Trạng thái hoạt động và mục tiêu</text><text x="32" y="105" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Các ví dụ độc lập · Lý do chờ luôn đi cùng hướng xử lý</text><rect x="32" y="144" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Ủ nước: thiếu nước</text><text x="56" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 0/120 · Linh dịch 0/30 · Tu vi 0/480</text><text x="56" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Cần 2 nước cho chu kỳ; hiện còn thiếu 2.</text><text x="56" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoạt động đang chờ. Lấy nước để chuẩn bị.</text><rect x="56" y="318" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="347.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn lấy nước</text><rect x="732" y="144" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Mộng cảnh: thiếu linh dịch</text><text x="756" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 4/120 · Linh dịch 0/30 · Tu vi 120/480</text><text x="756" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Cần 1 linh dịch cho chu kỳ tiếp theo.</text><text x="756" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Có thể bật chuỗi lấy nước → ủ nước → mộng cảnh.</text><rect x="756" y="318" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="347.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Bật chuẩn bị tự động</text><rect x="32" y="408" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="448" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Kho nước đầy</text><text x="56" y="481" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 120/120 · Linh dịch 0/30 · Tu vi 0/480</text><text x="56" y="518" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Kho đạt 120 nước; lấy nước đang chờ.</text><text x="56" y="547" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Ủ nước để tạo linh dịch và dành chỗ trong kho.</text><rect x="56" y="582" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="611.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn ủ nước</text><rect x="732" y="408" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="448" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Kho linh dịch đầy</text><text x="756" y="481" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 4/120 · Linh dịch 30/30 · Tu vi 120/480</text><text x="756" y="518" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Kho đạt 30 linh dịch; ủ nước đang chờ.</text><text x="756" y="547" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Mộng cảnh đã mở và cần 1 linh dịch mỗi chu kỳ.</text><rect x="756" y="582" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="611.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn mộng cảnh</text><rect x="32" y="672" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="712" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Đã luyện thử đủ ba lần</text><text x="56" y="745" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 0/120 · Linh dịch 4/30 · Tu vi 0/480</text><text x="56" y="782" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tu vi chưa giữ được ở giai đoạn này.</text><text x="56" y="811" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Chuẩn bị 6 linh dịch cho mốc kế tiếp; còn thiếu 2.</text><rect x="56" y="846" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="875.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn lấy nước</text><rect x="732" y="672" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="712" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Mốc nhận công pháp sẵn sàng</text><text x="756" y="745" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 6/120 · Linh dịch 2/30 · Tu vi 0/480</text><text x="756" y="782" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đã lấy nước 6/6 lần và ủ nước 3/3 lần.</text><text x="756" y="811" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Dùng 1 linh dịch khi hoàn thành mốc truyện.</text><rect x="756" y="846" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="875.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đọc mốc nhận công pháp</text><rect x="32" y="936" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="976" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Mộng cảnh đã dừng</text><text x="56" y="1009" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 4/120 · Linh dịch 2/30 · Tu vi 120/480</text><text x="56" y="1046" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn đã dừng hoạt động; linh dịch hiện còn 2.</text><text x="56" y="1075" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tiếp tục sẽ bắt đầu một chu kỳ mới từ 0 giây.</text><rect x="56" y="1110" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="1139.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Tiếp tục mộng cảnh</text><rect x="732" y="936" width="676" height="242" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="976" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Đủ tu vi để đột phá</text><text x="756" y="1009" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nước 0/120 · Linh dịch 0/30 · Tu vi 480/480</text><text x="756" y="1046" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Vương Lâm vẫn là phàm nhân; hoạt động đang chờ.</text><text x="756" y="1075" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đọc cảnh và hoàn tất đột phá để đạt Ngưng Khí tầng 1.</text><rect x="756" y="1110" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="1139.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đột phá</text><text x="32" y="1220" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản phác thiết kế · Chọn hoạt động mới xử lý thời gian rồi hủy phần chu kỳ dở.</text>
</svg>
