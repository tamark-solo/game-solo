<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc">
<title id="title">Tổng kết tự động trên màn hình rộng 360 px</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="360" height="1160" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><text x="16" y="34" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">TIÊN NGHỊCH</text><text x="344" y="34" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#245C53" text-anchor="end">Đã lưu</text><text x="16" y="80" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="400" fill="#252722" text-anchor="start">Chào mừng trở lại</text><text x="16" y="112" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Chuẩn bị tự động đã xử lý thời gian</text><rect x="16" y="140" width="328" height="192" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="32" y="186" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Vắng mặt</text><text x="328" y="186" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">10 giờ</text><text x="32" y="245" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Trong giới hạn</text><text x="328" y="245" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">8 giờ</text><text x="32" y="304" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Có hoạt động</text><text x="328" y="304" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">24 phút</text><text x="16" y="371" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">THAY ĐỔI RÒNG</text><rect x="16" y="390" width="328" height="206" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="32" y="432" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nước suối</text><text x="328" y="432" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">0</text><text x="32" y="456" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hiện có 0 / 120</text><text x="32" y="494" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Linh dịch</text><text x="328" y="494" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">0</text><text x="32" y="518" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hiện có 0 / 30</text><text x="32" y="556" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi</text><text x="328" y="556" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">+480</text><text x="32" y="580" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hiện có 480 / 480</text><rect x="16" y="620" width="328" height="262" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="32" y="663" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="400" fill="#252722" text-anchor="start">Đã đủ tu vi tầng đầu</text><text x="32" y="703" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start">Suối → Phòng riêng → Mộng cảnh.</text><text x="32" y="730" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start">Nước và linh dịch đã dùng trong</text><text x="32" y="757" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start">chuỗi; số trên là thay đổi ròng.</text><text x="32" y="784" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start"></text><text x="32" y="811" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start">Hoạt động dừng ở 480 tu vi.</text><text x="32" y="838" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="start">Vương Lâm vẫn là phàm nhân.</text><rect x="16" y="906" width="328" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="180.0" y="936.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#FBF7EE" text-anchor="middle">Xem mục tiêu đột phá</text><rect x="16" y="970" width="328" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="180.0" y="1000.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Đóng tổng kết</text><text x="16" y="1064" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Tiến trình đã được xử lý và lưu.</text><text x="16" y="1088" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Đóng bảng để tiếp tục xem hành trình.</text>
</svg>
