    <path d="m64 6 5 6-5 6-5-6Z"/><path d="m122 64-6 5-6-5 6-5Z"/>
    <path d="m64 122-5-6 5-6 5 6Z"/><path d="m6 64 6-5 6 5-6 5Z"/>
  </g>
  <path d="m64 43 20 34H44Z" fill="#eeb865" stroke="#153b3e" stroke-width="4" stroke-linejoin="round"/>
