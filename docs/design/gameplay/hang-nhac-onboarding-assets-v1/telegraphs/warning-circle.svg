    </pattern>
  </defs>
  <circle cx="64" cy="64" r="52" fill="#594023" fill-opacity=".25"/>
  <circle cx="64" cy="64" r="52" fill="url(#hatch)"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#153b3e" stroke-width="8"/>
  <circle cx="64" cy="64" r="52" fill="none" stroke="#f0b85f" stroke-width="3"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#173b3f" stroke-width="3"/>
  <circle cx="64" cy="64" r="45" fill="none" stroke="#ffe7b0" stroke-width="1"/>
