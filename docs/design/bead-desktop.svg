<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Hạt châu sau khi hoàn thành E07</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><rect x="32" y="32" width="196" height="896" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="87" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="23" font-weight="400" fill="#252722" text-anchor="start">TIÊN NGHỊCH</text><text x="56" y="117" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hành trình Vương Lâm</text><path d="M56 153 L80 143 L99 153 L120 133 L142 153 L173 146 L203 157" fill="none" stroke="#7A7464" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="204" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tu luyện</text><rect x="44" y="238" width="172" height="48" rx="6" fill="#DCE9E0" stroke="#DCE9E0" stroke-width="1"/><rect x="44" y="246" width="3" height="32" rx="0" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="64" y="268" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#245C53" text-anchor="start">Hạt châu</text><text x="64" y="332" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trình</text><text x="64" y="396" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trang</text><text x="64" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Cài đặt</text><text x="56" y="883" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản nhập môn</text><text x="252" y="922" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản phác thiết kế · dữ liệu minh họa</text><text x="252" y="80" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Hạt châu bí ẩn</text><text x="252" y="113" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Khám phá được ghi lại theo hành trình của Vương Lâm</text><rect x="252" y="160" width="500" height="658" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="203" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">HÌNH DẠNG HIỆN TẠI</text><circle cx="502" cy="363" r="137" fill="#F3EBDD" stroke="#CFC1A8" stroke-width="1"/><circle cx="502" cy="363" r="120" fill="#F3EBDD" stroke="#8FCBBE" stroke-width="2"/><circle cx="502" cy="363" r="104" fill="#E5DDD0" stroke="#7A7464" stroke-width="2"/><g transform="translate(502 363) scale(2.36)"><path d="M-13 -18 L-4 -6 L-12 11 M4 -21 V-2 L17 4 L7 17 M-13 23 L2 16 L17 25" fill="none" stroke="#245C53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="502" y="538" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="400" fill="#252722" text-anchor="middle">Các dấu đã hiện ra</text><text x="502" y="578" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="middle">Hoa văn đám mây đã biến mất.</text><text x="276" y="645" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Điều đã biết được giữ trong hành trình.</text><text x="276" y="676" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hình dạng vật phẩm theo khám phá hiện tại.</text><text x="276" y="707" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Có thể đọc lại những lần biến đổi.</text><rect x="276" y="746" width="452" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="502.0" y="776.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Xem lại lần khám phá mộng cảnh</text><rect x="776" y="160" width="632" height="214" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="800" y="200" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="26" font-weight="400" fill="#252722" text-anchor="start">Ủ nước với hạt châu</text><text x="800" y="238" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="20" font-weight="600" fill="#252722" text-anchor="start">2 nước → 1 linh dịch mỗi 10 giây</text><text x="800" y="274" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Hiện có 4 nước · 2 linh dịch</text><rect x="800" y="302" width="584" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="1092.0" y="332.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Xem cách ủ nước</text><rect x="776" y="398" width="632" height="266" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="800" y="440" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="26" font-weight="400" fill="#252722" text-anchor="start">Tu luyện trong mộng cảnh</text><text x="800" y="479" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Thời gian dài gấp mười lần bên ngoài.</text><text x="800" y="511" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Chuẩn bị linh dịch trước khi vào tu luyện.</text><text x="800" y="543" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Mỗi 10 giây: 1 linh dịch → 10 tu vi.</text><rect x="800" y="592" width="584" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1092.0" y="622.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#FBF7EE" text-anchor="middle">Xem mộng cảnh</text><rect x="776" y="688" width="632" height="130" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="800" y="728" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="22" font-weight="400" fill="#252722" text-anchor="start">Đi tới hoạt động để chọn cách tu luyện</text><text x="800" y="763" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Xem một mục giữ hoạt động đang thực hiện.</text><text x="800" y="792" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Chọn bắt đầu tại Tu luyện khi bạn sẵn sàng.</text>
</svg>
