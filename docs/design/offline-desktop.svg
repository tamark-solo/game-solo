<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">Tổng kết tự động từ kho trống đến đủ đột phá</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><rect x="32" y="32" width="196" height="896" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="87" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="23" font-weight="400" fill="#252722" text-anchor="start">TIÊN NGHỊCH</text><text x="56" y="117" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hành trình Vương Lâm</text><path d="M56 153 L80 143 L99 153 L120 133 L142 153 L173 146 L203 157" fill="none" stroke="#7A7464" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><rect x="44" y="174" width="172" height="48" rx="6" fill="#DCE9E0" stroke="#DCE9E0" stroke-width="1"/><rect x="44" y="182" width="3" height="32" rx="0" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="64" y="204" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#245C53" text-anchor="start">Tu luyện</text><text x="64" y="268" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hạt châu</text><text x="64" y="332" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trình</text><text x="64" y="396" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trang</text><text x="64" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Cài đặt</text><text x="56" y="883" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản nhập môn</text><text x="252" y="922" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản phác thiết kế · dữ liệu minh họa</text><text x="252" y="80" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Chào mừng trở lại</text><text x="252" y="113" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Chuỗi chuẩn bị tự động đã xử lý thời gian và lưu tiến trình</text><rect x="252" y="160" width="372" height="146" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="202" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">VẮNG MẶT</text><text x="276" y="263" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="400" fill="#252722" text-anchor="start">10 giờ</text><rect x="644" y="160" width="372" height="146" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="668" y="202" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">THỜI GIAN TRONG GIỚI HẠN</text><text x="668" y="263" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="400" fill="#252722" text-anchor="start">8 giờ</text><rect x="1036" y="160" width="372" height="146" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="1060" y="202" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">CÓ HOẠT ĐỘNG</text><text x="1060" y="263" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="38" font-weight="400" fill="#252722" text-anchor="start">24 phút</text><text x="252" y="350" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">THAY ĐỔI RÒNG CỦA TÀI NGUYÊN</text><rect x="252" y="374" width="372" height="130" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="414" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nước suối</text><text x="276" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="30" font-weight="600" fill="#252722" text-anchor="start">0</text><text x="600" y="478" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="end">Hiện có 0</text><rect x="644" y="374" width="372" height="130" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="668" y="414" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Linh dịch</text><text x="668" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="30" font-weight="600" fill="#252722" text-anchor="start">0</text><text x="992" y="478" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="end">Hiện có 0</text><rect x="1036" y="374" width="372" height="130" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="1060" y="414" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi</text><text x="1060" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="30" font-weight="600" fill="#245C53" text-anchor="start">+480</text><text x="1384" y="478" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="end">Hiện có 480</text><rect x="252" y="528" width="1156" height="322" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="573" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="29" font-weight="400" fill="#252722" text-anchor="start">Tu vi đã đủ cho tầng đầu</text><text x="276" y="616" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Chuỗi đã chạy: Suối → Phòng riêng → Mộng cảnh.</text><text x="276" y="649" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Nước và linh dịch tạo ra đã dùng trong chuỗi; số trên là thay đổi ròng.</text><text x="276" y="682" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoạt động dừng ở 480 tu vi. Vương Lâm vẫn là phàm nhân.</text><text x="276" y="715" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đột phá khi bạn sẵn sàng; thời gian còn lại không tạo thêm tu vi.</text><rect x="276" y="778" width="240" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="396.0" y="808.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Đóng tổng kết</text><rect x="532" y="778" width="852" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="958.0" y="808.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#FBF7EE" text-anchor="middle">Xem mục tiêu đột phá</text>
</svg>
