<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hằng Nhạc · animation nhiệm vụ</title>
<style>body{margin:0;background:#162e2b;color:#eee5ca;font:15px/1.6 'Segoe UI',sans-serif;padding:24px}main{max-width:1200px;margin:auto}h1,h2{font-family:Cambria,serif;font-weight:500}h1{margin:0}p{max-width:80ch;color:#c6d4bd}button,select{font:inherit;background:#294b3f;color:#f0e2bf;border:1px solid #bba46a;padding:8px 16px;min-height:44px;border-radius:4px}header{position:sticky;top:0;background:#162e2b;z-index:2;padding:12px 0;display:flex;flex-wrap:wrap;gap:12px}section{margin:20px 0;border:1px solid #a9946255;padding:16px;border-radius:8px}.rows{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.cell{display:flex;gap:12px;align-items:center;background:#e2e4d0;color:#314332;padding:12px;border-radius:5px}.sprite{width:96px;height:96px;flex:none;background-repeat:no-repeat;image-rendering:pixelated;transform-origin:center}small{display:block;color:#5b6a51}.error{color:#ffbe9b}</style>
<main><h1>Hằng Nhạc · động tác nhiệm vụ bổ sung</h1><p>21 clip / 84 frame cho bộ ba hiện hành. Canvas động tác 96 × 96, neo (48,88); người trong game giữ tỷ lệ 1×, locomotion vẫn 64 × 96. Đây là trang xem ART mới, chưa ghi nhận owner duyệt hình.</p><header><button id="play">Tạm dừng</button><label>Cỡ xem <select id="scale"><option value="1">1× native</option><option value="2">2×</option></select></label><button id="step">Frame kế tiếp</button><label>Nền <select id="background"><option value="#e2e4d0">Giấy sáng</option><option value="#213e3c">Ngọc tối</option></select></label></header><div id="content"></div><p id="error" class="error"></p></main>
<script type="module">
const catalog=await fetch('./clips.json').then(r=>r.json());const names={'CHR-WANG-LIN-CHIBI':'Vương Lâm','CHR-SITU-NAN':'Tư Đồ Nam','CHR-LI-MUWAN':'Lý Mộ Uyển'},labels={'basic-south':'Đòn thường · Nam','basic-west':'Đòn thường · Tây','basic-east':'Đòn thường · Đông','basic-north':'Đòn thường · Bắc',greeting:'Chào / tiếp dẫn',cultivation:'Vận khí đứng / ổn định linh thể',recovery:'Dùng vật tư / hồi phục'};
const items=[];
for(const [actor,bindings]of Object.entries(catalog.bindings)){const section=document.createElement('section'),title=document.createElement('h2'),rows=document.createElement('div');title.textContent=names[actor];rows.className='rows';section.append(title,rows);document.querySelector('#content').append(section);
for(const [key,id]of Object.entries(bindings)){const c=catalog.clips[id],cell=document.createElement('div'),sprite=document.createElement('div'),text=document.createElement('div'),small=document.createElement('small');cell.className='cell';sprite.className='sprite';sprite.style.backgroundImage=`url(${location.pathname.startsWith('/assets/quest-motion/')?c.atlasUrl:'./atlases/'+c.atlasUrl.split('/').at(-1)})`;text.textContent=labels[key];small.textContent=`4 frame · ${c.fps} FPS`;text.append(small);cell.append(sprite,text);rows.append(cell);items.push({sprite,c});}}
let running=true,start=performance.now(),manual=0;const draw=now=>{for(const {sprite,c}of items){const i=running?Math.floor((now-start)*c.fps/1000)%4:manual;const r=c.frames[i];sprite.style.backgroundPosition=`-${r.x}px -${r.y}px`;}requestAnimationFrame(draw);};requestAnimationFrame(draw);
document.querySelector('#play').onclick=e=>{running=!running;start=performance.now();e.target.textContent=running?'Tạm dừng':'Chạy animation';};
document.querySelector('#step').onclick=()=>{running=false;manual=(manual+1)%4;document.querySelector('#play').textContent='Chạy animation';};
document.querySelector('#scale').onchange=e=>{for(const {sprite}of items){sprite.style.transform=`scale(${e.target.value})`;sprite.parentElement.style.minHeight=e.target.value==='2'?'220px':'96px';sprite.parentElement.style.paddingInline=e.target.value==='2'?'60px':'12px';}};
document.querySelector('#background').onchange=e=>{for(const {sprite}of items)sprite.parentElement.style.background=e.target.value;};
</script></html>
