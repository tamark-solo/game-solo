<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">Trạng thái truyện, hành trang và hình hạt châu</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="1160" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><text x="32" y="66" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Đọc truyện, vật phẩm và hình dạng hạt châu</text><text x="32" y="105" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Các ví dụ độc lập · Màn mới chỉ hiển thị những điều đã biết</text><rect x="32" y="144" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Để đọc sau: giữ vị trí</text><text x="56" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nhận công pháp · Đoạn 2/2</text><text x="56" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoạt động đã dừng trong lúc đọc mốc mới.</text><text x="56" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Linh dịch còn 2; chi phí 1 chưa được trừ.</text><text x="56" y="312" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đọc tiếp để trở lại đúng đoạn đã lưu.</text><rect x="56" y="382" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="411.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đọc tiếp</text><rect x="732" y="144" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Lịch sử: xem lại cảnh</text><text x="756" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nhận công pháp · Cảnh đã hoàn thành</text><text x="756" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đang lấy nước tại suối · 6/10 giây.</text><text x="756" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoạt động tiếp tục trong khi xem lịch sử.</text><text x="756" y="312" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Vật phẩm và tài nguyên giữ theo tiến trình hiện tại.</text><rect x="756" y="382" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="411.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đóng lịch sử</text><rect x="32" y="474" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="514" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Chuẩn bị đột phá</text><text x="56" y="547" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Vương Lâm · Phàm nhân · Tu vi 480/480</text><text x="56" y="584" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đây là đoạn cuối của cảnh đột phá.</text><text x="56" y="613" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoàn tất để đạt Ngưng Khí tầng 1 và lưu kết quả.</text><text x="56" y="642" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Nếu trở lại trước khi hoàn tất, đọc tiếp cảnh này.</text><rect x="56" y="712" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="741.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Hoàn tất đột phá</text><rect x="732" y="474" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="514" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Hạt châu: chưa có vật phẩm</text><text x="756" y="547" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Vật phẩm chưa được nhận</text><text x="756" y="584" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn chưa nhận được vật phẩm ở khu vực này.</text><text x="756" y="613" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Theo mục tiêu hiện tại để tiếp tục hành trình.</text><text x="756" y="642" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Thông tin khám phá sẽ xuất hiện khi bạn nhận được.</text><rect x="756" y="712" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="741.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Xem mục tiêu</text><rect x="32" y="804" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="844" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Hành trang đang trống</text><text x="56" y="877" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Đầu hành trình nhập môn</text><text x="56" y="914" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Vật phẩm nhận được sẽ xuất hiện tại đây.</text><text x="56" y="943" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Mỗi vật phẩm có mô tả và cách dùng đã biết.</text><text x="56" y="972" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tiếp tục hành trình theo mục tiêu hiện tại.</text><rect x="56" y="1042" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="1071.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Tiếp tục hành trình</text><rect x="732" y="804" width="676" height="306" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="844" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Biến thể theo mốc đã hoàn thành</text><circle cx="822" cy="924" r="39" fill="#E5DDD0" stroke="#7A7464" stroke-width="2"/><g transform="translate(822.00 898.65) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(846.11 916.17) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(836.90 944.51) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(807.10 944.51) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(797.89 916.17) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="822" y="987" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="middle">5 đám mây</text><circle cx="982" cy="924" r="39" fill="#E5DDD0" stroke="#7A7464" stroke-width="2"/><g transform="translate(982.00 898.65) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1001.82 908.19) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1006.71 929.64) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(993.00 946.84) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(971.00 946.84) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(957.29 929.64) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(962.18 908.19) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="982" y="987" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="middle">7 đám mây</text><circle cx="1142" cy="924" r="39" fill="#E5DDD0" stroke="#7A7464" stroke-width="2"/><g transform="translate(1142.00 898.65) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1158.29 904.58) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1166.96 919.60) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1163.95 936.67) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1150.67 947.82) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1133.33 947.82) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1120.05 936.67) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1117.04 919.60) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><g transform="translate(1125.71 904.58) scale(0.89)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1142" y="987" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="middle">9 đám mây</text><circle cx="1302" cy="924" r="39" fill="#E5DDD0" stroke="#7A7464" stroke-width="2"/><g transform="translate(1302 924) scale(0.89)"><path d="M-13 -18 L-4 -6 L-12 11 M4 -21 V-2 L17 4 L7 17 M-13 23 L2 16 L17 25" fill="none" stroke="#245C53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><text x="1302" y="987" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#252722" text-anchor="middle">Có dấu</text><text x="756" y="1041" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Mười đám mây là chuyển tiếp trong cảnh khám phá.</text><text x="756" y="1070" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Xem lịch sử dùng hình của cảnh; vật phẩm giữ hình hiện tại.</text><text x="32" y="1142" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hình châu và icon là nét phác SVG để duyệt bố cục; nguồn game tiếp tục theo kế hoạch asset.</text>
</svg>
