<svg xmlns="http://www.w3.org/2000/svg" width="360" height="1160" viewBox="0 0 360 1160" role="img" aria-labelledby="title desc">
<title id="title">Tu luyện sau khi mở mộng cảnh — mobile 360 px</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="360" height="1160" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><text x="16" y="34" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">TIÊN NGHỊCH</text><text x="344" y="34" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#245C53" text-anchor="end">Đã lưu</text><text x="16" y="73" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="21" font-weight="400" fill="#252722" text-anchor="start">Vương Lâm · Phàm nhân</text><rect x="16" y="96" width="328" height="136" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="32" y="129" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="23" font-weight="400" fill="#252722" text-anchor="start">Chuẩn bị đột phá</text><text x="32" y="157" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi 120/480 · còn thiếu 360</text><rect x="32" y="172" width="296" height="48" rx="6" fill="#E5DDD0" stroke="#CFC1A8" stroke-width="1"/><text x="180.0" y="202.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#605E54" text-anchor="middle">Đột phá</text><rect x="16" y="240" width="328" height="152" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="32" y="274" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nước suối</text><text x="328" y="274" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">0 / 120</text><text x="32" y="318" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Linh dịch</text><text x="328" y="318" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fi