<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">Offline không hoạt động, lỗi lưu và tab chỉ xem</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="1120" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><text x="32" y="66" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Tổng kết, bản lưu và quyền chơi</text><text x="32" y="105" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Các ví dụ độc lập · Phản hồi bằng chữ, giữ rõ tiến trình nào đang được dùng</text><rect x="32" y="144" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Trở lại khi đã dừng hoạt động</text><text x="56" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Vắng mặt 3 giờ 30 phút · Có hoạt động 0 phút</text><text x="56" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Nước 0 · Linh dịch 0 · Tu vi 0 thay đổi.</text><text x="56" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn đã dừng hoạt động trước khi rời game.</text><text x="56" y="312" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đóng tổng kết rồi chọn hoạt động để tiếp tục.</text><rect x="56" y="364" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="370.0" y="393.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đóng tổng kết</text><rect x="732" y="144" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="184" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Trở lại khi đang đọc truyện</text><text x="756" y="217" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Nhận công pháp · Đoạn 2/2 · Có hoạt động 0 phút</text><text x="756" y="254" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hoạt động giữ dừng trong quãng vắng mặt.</text><text x="756" y="283" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Linh dịch vẫn còn 2; chi phí 1 chưa được trừ.</text><text x="756" y="312" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Đọc tiếp để trở lại đúng đoạn.</text><rect x="756" y="364" width="628" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1070.0" y="393.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Đọc tiếp</text><rect x="32" y="456" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="496" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Chưa lưu được thay đổi mới</text><text x="56" y="529" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Tiến trình hiện tại vẫn được giữ trên trang</text><text x="56" y="566" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Thử lưu lại hoặc xuất tiến trình đang xem.</text><text x="56" y="595" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Thông báo cập nhật khi việc lưu hoàn thành.</text><text x="56" y="624" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn có thể tiếp tục từ trạng thái hiện tại trên trang.</text><rect x="56" y="676" width="302" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="207.0" y="705.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Thử lưu lại</text><rect x="374" y="676" width="310" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="529.0" y="705.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#252722" text-anchor="middle">Xuất tiến trình hiện tại</text><rect x="732" y="456" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="496" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Bản lưu không hợp lệ</text><text x="756" y="529" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Tiến trình đang chơi được giữ nguyên</text><text x="756" y="566" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Thứ tự hành trình trong bản lưu không hợp lệ.</text><text x="756" y="595" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Chọn file khác để xem trước và kiểm tra lại.</text><text x="756" y="624" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn vẫn có thể tiếp tục tiến trình hiện tại.</text><rect x="756" y="676" width="302" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="907.0" y="705.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn file khác</text><rect x="1074" y="676" width="310" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="1229.0" y="705.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#252722" text-anchor="middle">Giữ tiến trình hiện tại</text><rect x="32" y="768" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="808" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Bản lưu chưa được hỗ trợ</text><text x="56" y="841" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Tiến trình đang chơi được giữ nguyên</text><text x="56" y="878" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Phiên bản của bản lưu này chưa được hỗ trợ.</text><text x="56" y="907" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Chọn bản lưu phù hợp để tiếp tục nhập.</text><text x="56" y="936" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">File hiện tại chưa thay thế tiến trình đang chơi.</text><rect x="56" y="988" width="302" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="207.0" y="1017.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chọn file khác</text><rect x="374" y="988" width="310" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="529.0" y="1017.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#252722" text-anchor="middle">Giữ tiến trình hiện tại</text><rect x="732" y="768" width="676" height="288" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="756" y="808" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#252722" text-anchor="start">Tab này chỉ xem tiến trình</text><text x="756" y="841" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Game đang chạy ở một tab khác</text><text x="756" y="878" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn có thể xem hành trình và xuất bản đã lưu.</text><text x="756" y="907" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Để điều khiển hoạt động tại đây, chuyển quyền chơi.</text><text x="756" y="936" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tiến trình mới nhất được mở sau khi chuyển quyền.</text><rect x="756" y="988" width="302" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="907.0" y="1017.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#FBF7EE" text-anchor="middle">Chuyển quyền chơi</text><rect x="1074" y="988" width="310" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="1229.0" y="1017.78" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="17" font-weight="600" fill="#252722" text-anchor="middle">Xem hành trình</text><text x="32" y="1102" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản phác thiết kế · Tổng kết hiển thị kết quả đã lưu; tab chỉ xem không xử lý hoạt động hoặc nhận lại offline.</text>
</svg>
