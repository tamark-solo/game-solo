ecap="round" stroke-linejoin="round" /></g><g transform="translate(292.79 209.46) scale(0.59)"><path d="M-8 3 C-11 -2,-6 -6,-2 -3 C1 -9,9 -5,8 0 C14 0,12 6,7 6 H-6 C-11 6,-12 3,-8 3" fill="none" stroke="#605E54" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></g><text x="356" y="204" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="400" fill="#252722" text-anchor="start">Hạt châu bí ẩn</text><text x="356" y="241" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Công dụng được khám phá qua hành trình.</text><text x="928" y="274" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#245C53" text-anchor="end">Xem chi tiết</text><rect x="252" y="316" width="700" height="132" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><path d="M298 353 H314 V361 C327 371,319 377,316 379 C337 406,277 406,296 379 C288 373,289 366,298 361 Z M296 378 H316" fill="none" stroke="#245C53" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><text x="356" y="360" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="400" fill="#252722" text-anchor="start">Bầu nước</text><text x="356" y="397" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Dùng chuẩn bị nước cho sinh hoạt và tu luyện.</text><text x="928" y="430" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#245C53" text-anchor="end">Xem chi tiết</text><rect x="252" y="472" width="700" height="132" rx="10" fill="#DCE9E0" stroke="#245C53" stroke-width="2"/><rect x="283" y="510" width="44" height="44" rx="3" fill="#F3EBDD" stroke="#245C53" stroke-width="2"/><path d="M292 510 V554 M301 522 H319 M301 532 H319 M301 542 H313" fill="none" stroke="#245C53" stroke-width="2" stroke-linecap="round" stroke-linejoi