ont-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="20" font-weight="600" fill="#252722" text-anchor="end">2 / 30</text><text x="1000" y="823" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi</text><text x="1384" y="823" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="20" font-weight="600" fill="#252722" text-anchor="end">0 / 480</text><text x="252" y="839" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Chọn vật phẩm để xem vai trò và hoạt động liên quan.</text>
