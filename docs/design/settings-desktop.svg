ảnh đã mở · Tu vi 120/480</text><text x="924" y="422" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Xuất bản lưu để giữ một bản cho mình.</text><text x="924" y="453" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nhập file sẽ mở phần xem trước</text><text x="924" y="484" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">để bạn chọn tiến trình muốn dùng.</text><rect x="924" y="552" width="220" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="1034.0" y="582.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Xuất bản lưu</text><rect x="1160" y="552" width="224" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1272.0" y="582.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#FBF7EE" text-anchor="middle">Nhập bản lưu</text><rect x="252" y="680" width="1156" height="138" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="724" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="24" font-weight="400" fill="#252722" text-anchor="start">Cách đọc do bạn chọn</text><text x="276" y="760" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Các thiết lập đọc được giữ khi trở lại hành trình.</text><text x="276" y="789" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Đổi cỡ chữ hoặc giảm chuyển động giữ nguyên tiến trình tu luyện.</text>
