<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
<title id="title">So sánh tiến trình trước khi thay bản lưu</title>
<desc id="desc">Bản phác UX và ART của MVP A; ảnh minh họa dùng bảng tham chiếu mỹ thuật. Các nút là phần của bản vẽ thiết kế.</desc>
<rect x="0" y="0" width="1440" height="960" rx="0" fill="#F3EBDD" stroke="#F3EBDD" stroke-width="1"/><rect x="32" y="32" width="196" height="896" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="56" y="87" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="23" font-weight="400" fill="#252722" text-anchor="start">TIÊN NGHỊCH</text><text x="56" y="117" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Hành trình Vương Lâm</text><path d="M56 153 L80 143 L99 153 L120 133 L142 153 L173 146 L203 157" fill="none" stroke="#7A7464" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /><text x="64" y="204" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Tu luyện</text><text x="64" y="268" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hạt châu</text><text x="64" y="332" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trình</text><text x="64" y="396" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Hành trang</text><rect x="44" y="430" width="172" height="48" rx="6" fill="#DCE9E0" stroke="#DCE9E0" stroke-width="1"/><rect x="44" y="438" width="3" height="32" rx="0" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="64" y="460" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#245C53" text-anchor="start">Cài đặt</text><text x="56" y="883" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản nhập môn</text><text x="252" y="922" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="400" fill="#605E54" text-anchor="start">Bản phác thiết kế · dữ liệu minh họa</text><text x="252" y="80" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="32" font-weight="400" fill="#252722" text-anchor="start">Xem trước bản lưu</text><text x="252" y="113" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Chọn tiến trình muốn tiếp tục trước khi thay bản đang chơi</text><rect x="252" y="160" width="564" height="436" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="203" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">ĐANG CHƠI</text><text x="276" y="254" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="400" fill="#252722" text-anchor="start">Vương Lâm · Phàm nhân</text><text x="276" y="295" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="20" font-weight="600" fill="#245C53" text-anchor="start">Mộng cảnh đã mở</text><text x="276" y="337" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">7/8 mốc đã hoàn thành</text><text x="276" y="405" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nước suối</text><text x="792" y="405" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">0 / 120</text><text x="276" y="457" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Linh dịch</text><text x="792" y="457" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">6 / 30</text><text x="276" y="509" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi</text><text x="792" y="509" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">120 / 480</text><text x="276" y="568" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">Bản hiện tại trên trình duyệt này</text><rect x="844" y="160" width="564" height="436" rx="10" fill="#FBF7EE" stroke="#245C53" stroke-width="2"/><text x="868" y="203" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="14" font-weight="600" fill="#605E54" text-anchor="start">FILE ĐƯỢC CHỌN</text><text x="868" y="254" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="28" font-weight="400" fill="#252722" text-anchor="start">Vương Lâm · Phàm nhân</text><text x="868" y="295" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="20" font-weight="600" fill="#245C53" text-anchor="start">Đã nhận công pháp</text><text x="868" y="337" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">5/8 mốc đã hoàn thành</text><text x="868" y="405" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Nước suối</text><text x="1384" y="405" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">6 / 120</text><text x="868" y="457" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Linh dịch</text><text x="1384" y="457" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">2 / 30</text><text x="868" y="509" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#605E54" text-anchor="start">Tu vi</text><text x="1384" y="509" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="24" font-weight="600" fill="#252722" text-anchor="end">0 / 480</text><text x="868" y="568" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="16" font-weight="400" fill="#605E54" text-anchor="start">vuong-lam-nhap-mon.json</text><rect x="252" y="620" width="1156" height="236" rx="10" fill="#FBF7EE" stroke="#CFC1A8" stroke-width="1"/><text x="276" y="664" font-family="Cambria, &#x27;Times New Roman&#x27;, serif" font-size="25" font-weight="400" fill="#245C53" text-anchor="start">Bản lưu hợp lệ</text><text x="276" y="704" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bản được chọn sẽ thay thế toàn bộ tiến trình đang chơi.</text><text x="276" y="735" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="400" fill="#252722" text-anchor="start">Bạn sẽ tiếp tục từ mốc nhận công pháp; mộng cảnh chưa được mở trong bản này.</text><rect x="276" y="784" width="340" height="48" rx="6" fill="#FBF7EE" stroke="#7A7464" stroke-width="1"/><text x="446.0" y="814.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#252722" text-anchor="middle">Giữ tiến trình đang chơi</text><rect x="632" y="784" width="752" height="48" rx="6" fill="#245C53" stroke="#245C53" stroke-width="1"/><text x="1008.0" y="814.12" font-family="&#x27;Segoe UI&#x27;, Arial, sans-serif" font-size="18" font-weight="600" fill="#FBF7EE" text-anchor="middle">Thay bằng bản lưu được chọn</text>
